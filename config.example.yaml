llm:
  provider: "answer_model"

vlm:
  provider: "layout_model"

models:
  answer_model:
    provider: "openai_compatible"
    base_url: "${TABLE_AGENT_LLM_BASE_URL:-http://localhost:8000/v1}"
    model: "${TABLE_AGENT_LLM_MODEL:-your-answer-model}"
    api_key: "${TABLE_AGENT_LLM_API_KEY:-EMPTY}"
    temperature: 0.0
    max_tokens: null
    timeout_seconds: 180
  retrieval_embedding_model:
    provider: "openai_compatible"
    base_url: "${TABLE_AGENT_EMBEDDING_BASE_URL:-http://localhost:8001/v1}"
    model: "${TABLE_AGENT_EMBEDDING_MODEL:-BAAI/bge-m3}"
    api_key: "${TABLE_AGENT_EMBEDDING_API_KEY:-EMPTY}"
    timeout_seconds: "${TABLE_AGENT_EMBEDDING_TIMEOUT_SECONDS:-120}"

vlm_models:
  layout_model:
    provider: "openai_compatible"
    base_url: "${TABLE_AGENT_VLM_BASE_URL:-http://localhost:8000/v1}"
    model: "${TABLE_AGENT_VLM_MODEL:-your-vision-model}"
    api_key: "${TABLE_AGENT_VLM_API_KEY:-EMPTY}"
    temperature: 0.0
    max_tokens: null
    timeout_seconds: 180

table_agent:
  phase: "all"
  structure_cache_dir: "cache/table_agent/structure"
  artifact_root: "outputs/table_agent/artifacts"
  run_dir_template: "{run_name}"
  repeat_dir_template: "repeat_{run_id}"
  artifact_dir: "outputs/table_agent"
  max_refinement_rounds: 3
  max_context_chars: 240000
  render_timeout_seconds: 60
  libreoffice_path: null
  libreoffice_image_resolution: 600
  workbook_show_coordinates: true
  max_cell_width: 50
  generation_max_tokens: 8192
  max_image_dimension: 8192
  max_image_pixels: 33554432
  image_tile_size: null
  image_tile_overlap: 256
  routing:
    retrieval:
      # off: use the supplied workbook/structure without source retrieval.
      # auto: skip retrieval for an explicit single sheet/table; retrieve otherwise.
      # lexical: BM25/keyword retrieval only; hybrid also uses embeddings when available.
      # indexed: do not prepare/select local sources; use incoming indexed artifacts.
      # perfect: deterministic/oracle source selection for controlled evaluations.
      mode: "auto"
      rerank_with_llm: true
      top_k: 8
      candidate_max_chars: 4000
      bm25_weight: 0.3
      embedding_weight: 0.7
      explicit_workbook_guard: true
      explicit_sheet_guard: true
      audit_top_k: 10
      query_type: "auto"
      max_batches: 3
    qa:
      # auto lets the planner route common-info questions; normal disables that route.
      # common_info forces the deterministic common-info route when enabled.
      mode: "auto"
      common_info_enabled: true
      common_info_fallback: "normal"
  exstruct_mode: "light"
  viewport_rows: 50
  viewport_columns: 50
  shift_cells: 45
  max_retry: 3
  qa_max_retries: 3
  qa_instant_max_retries: 1
  qa_instant_generation_max_tokens: 2048
  qa_max_replans: 5
  qa_max_experience_records: 5
  qa_log_path: null
  qa_max_observation_chars: 2000
  qa_max_error_chars: 2000
  qa_max_value_repr_chars: 800
  # Shared by query-time hybrid retrieval and optional ingestion embedding export.
  retrieval_embedding_provider: "retrieval_embedding_model"
  # Ingestion only: add embeddings to exported retrieval cards when requested.
  embed_retrieval_cards: false

service:
  root_dir: "outputs"
  max_workers: 1
  max_upload_mb: 100
  api_key: "${TABLE_AGENT_SERVICE_API_KEY:-}"
  allow_local_paths: false
  allowed_input_roots: []
