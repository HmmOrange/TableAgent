# Copy to config.yaml and fill in the models. ${NAME:-default} reads the environment variable NAME.

# Models: `llm` answers, `vlm` looks at rendered cell ranges (leave it out to answer from cell values only).
llm: answer_model
vlm: vision_model

# Model profiles (OpenAI-compatible chat-completions endpoints); the names above pick one.
models:
  answer_model:
    provider: openai_compatible
    base_url: "${TABLE_AGENT_LLM_BASE_URL:-http://localhost:8000/v1}"
    model: "${TABLE_AGENT_LLM_MODEL:-your-answer-model}"
    api_key: "${TABLE_AGENT_LLM_API_KEY:-EMPTY}"
    temperature: 0.0
    timeout_seconds: 180
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  vision_model:
    provider: openai_compatible
    base_url: "${TABLE_AGENT_VLM_BASE_URL:-http://localhost:8000/v1}"
    model: "${TABLE_AGENT_VLM_MODEL:-your-vision-model}"
    api_key: "${TABLE_AGENT_VLM_API_KEY:-EMPTY}"
    temperature: 0.0
    timeout_seconds: 180
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

# How questions are answered (TableAgent/settings.py); every key is optional.
table_agent:
  plan_count: 2                 # starting plans written independently, then reconciled when above 1
  checker: [independent]        # Checkers that test each value read: reverse, independent, debate
  checker_view: frame           # what the independent Checker reads the workbook through: grid, frame, image
  checker_sees_value: true      # the Checker sees the value it tests
  synthesis_check: false        # a Checker reviews how the answer was computed
  generation_max_tokens: 8192   # generation cap of both models
  max_context_chars: 240000     # table text of a fallback answer is cut to this length
  libreoffice_path: null        # soffice executable when it is not on PATH
  image_resolution: 600
  render_timeout_seconds: 60
  max_cell_width: 50
  show_coordinates: true

# HTTP service and CLI.
service:
  root_dir: outputs             # one directory per job
  max_workers: 1                # questions of a job answered at once
  max_upload_mb: 100
  api_key: "${TABLE_AGENT_SERVICE_API_KEY:-}"
  allow_local_paths: false      # POST /v1/jobs with a workbook path
  allowed_input_roots: []
