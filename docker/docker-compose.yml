name: tableagent

services:
  table-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "${TABLE_AGENT_HOST_PORT:-18001}:3636"
    volumes:
      - table-agent-cache:/app/cache
      - table-agent-outputs:/app/outputs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3636/health/ready', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      axiom-k8s:
        aliases:
          - table-agent
          - table-agent-api

volumes:
  table-agent-cache:
  table-agent-outputs:

networks:
  axiom-k8s:
    external: true
    name: axiom-k8s
